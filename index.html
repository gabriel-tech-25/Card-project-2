<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>blog-preview-card</title>
</head>
<body>
    <main class="card">
      <div class="blog-image">
        <img src="assets/images/illustration-article.svg" alt="">
      </div>
      <div class="content">
       <span class="category text-preset-bold">Learning</span>
        <p class="publish-date text-preset">Published 21 Dec 2026</p>
        <h1 class="title text-preset-bold">HTML & CSS foundations</h1>
        <p class="description text-preset">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="author">
        <div class="userpic">
          <img src="assets/images/image-avatar.webp" alt="">
        </div>
        <p class="author-name text-preset-bold">Greg Hooper</p>
      </div>
    </main>
</body>
</html>
